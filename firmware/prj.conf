CONFIG_HEAP_SIZE=0xC000
CONFIG_PSRAM_HEAP_SIZE=0x300000
CONFIG_LISA_WIFI=y
CONFIG_WIFI_LWIP_SAME_CORE=y
CONFIG_MAC_MANAGER=y
CONFIG_MAC_MANAGER_MAC_BY_CHIP_ID=y
CONFIG_WIFI_MANAGER=y
CONFIG_LISA_PORTING=y
CONFIG_LISA_OS=y
CONFIG_LOG=y
CONFIG_PRINTF_LOG_REDIRECT=y
# Current SDK boot with GCC 14 requires more than the historical 8 KiB default.
CONFIG_BOOT_FLASH_SIZE=0x10000
CONFIG_MAIN_TASK_STACK_SIZE=12288
CONFIG_BOOT_FEATURES=y
CONFIG_FILE_SYSTEM=y
CONFIG_LSFS=y
CONFIG_CJSON=y
CONFIG_DISK_DRIVER=y

# Arcs-Mini 240x240 ST7789, native RGB565 over SPI0 DMA.
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_PWM=y
CONFIG_LISA_SPI0=y
CONFIG_LISA_DISPLAY_DEVICE=y
CONFIG_LISA_DISPLAY_PANEL_ST7789P3=y
CONFIG_PANEL_ST7789P3_WIDTH=240
CONFIG_PANEL_ST7789P3_HEIGHT=240
CONFIG_PANEL_ST7789P3_X_OFFSET=0
CONFIG_PANEL_ST7789P3_Y_OFFSET=0
CONFIG_LISA_DISPLAY_BUS_SPI_4WIRE=y
CONFIG_LISA_DISPLAY_COLOR_INVERT=y
CONFIG_MEM_FLASH_SIZE=0x01000000

# Required read-only TF resource storage.
CONFIG_FATFS_FILESYSTEM=y
CONFIG_LSFS_FAT=y
CONFIG_DISK_DRIVER_SDMMC=y

# Resolve normal DNS and .local mDNS bridge names.
CONFIG_LWIP_OPTION_LWIP_DNS=y
