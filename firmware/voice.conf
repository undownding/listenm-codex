# Paired with the SDK single-mic sample's AP image and resource layout.
CONFIG_MEM_FLASH_BASE=0x30800000
CONFIG_MEM_FLASH_SIZE=0x00800000
CONFIG_MEM_PSRAM_BASE=0x28800000
CONFIG_MEM_PSRAM_SIZE=0x00800000
CONFIG_BOOT=n
CONFIG_BOOT_HART=n
CONFIG_HEAP_SIZE=0x10000
CONFIG_PSRAM_HEAP_SIZE=0x500000
CONFIG_ARCS_HAL_LSF=y
CONFIG_IPC_LSF=y
CONFIG_ARCS_GPDMA_FULL_INIT=y
CONFIG_LISA_DEVICE=y
CONFIG_LISA_AUDIO_DEVICE=y
CONFIG_ACOMP=y
CONFIG_ACOMP_WAKEUP=y
CONFIG_ACOMP_WAKEUP_ALGORITHM_TYPE_SINGLE_MIC=y
CONFIG_ACOMP_WAKEUP_RES_CAE_ESR_MLP_ADDRESS=0x30200000
CONFIG_ACOMP_WAKEUP_RES_CAE_ESR_MLP_LENGTH=1431296
CONFIG_ACOMP_WAKEUP_RES_AI_WRAP_ADDRESS=0x304D0000
CONFIG_ACOMP_WAKEUP_RES_AI_WRAP_LENGTH=763
CONFIG_BOOT_FEATURES=n
# Match the prebuilt single-mic AP image's memap.h (not current SDK defaults).
CONFIG_MEM_SRAM_BASE=0x20010000
CONFIG_MEM_SRAM_SIZE=0x00030000
CONFIG_MEM_IPC_BASE=0x20040000
CONFIG_MEM_APRAM_BASE=0x20058800
CONFIG_MEM_APRAM_SIZE=0x00057800
CONFIG_LISA_AUDIO_RECORD_BUFFER_SAMPLES=256
