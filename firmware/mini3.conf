# Match SDK res/arcs-mini3/{boot,ap}.bin and apps/arcs-mini/memap.h.
# LS2663: AP owns the first 3 MiB; CP owns the remaining 5 MiB.
CONFIG_MEM_FLASH_BASE=0x30600000
CONFIG_MEM_FLASH_SIZE=0x00400000
CONFIG_MEM_PSRAM_BASE=0x28300000
CONFIG_MEM_PSRAM_SIZE=0x00500000
CONFIG_PSRAM_HEAP_SIZE=0x00480000
CONFIG_MEM_WFRAM_BASE=0x20000080
CONFIG_MEM_WFRAM_SIZE=0x00016F80
CONFIG_MEM_SRAM_BASE=0x20017000
CONFIG_MEM_SRAM_SIZE=0x00029000
# The paired AP uses the IPC environment before shared crypto locks. Without
# it CP places locks at 0x20040008, inside AP IPC data, and Wi-Fi deadlocks.
CONFIG_ARCS_HAL_IPC=y

# ADB device transport; recovery must not depend on TF or network startup.
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_DEVICE=y
CONFIG_CHERRYUSB_DEVICE_SPEED_HS=y
CONFIG_CHERRYUSB_DEVICE_MUSB_LISA=y
CONFIG_CHERRYUSB_DEVICE_TEMPLATE_NONE=y
CONFIG_CHERRYUSB_APP_CLASS=y
CONFIG_ADB=y
CONFIG_ADB_REBOOT=y
CONFIG_ADB_MAX_PAYLOAD_SIZE=4096
# This product exposes an ADB USB device, not USB host peripherals.
CONFIG_CHERRYUSB_HOST=n
CONFIG_CHERRYUSB_HOST_MUSB_LISA=n
CONFIG_CHERRYUSB_HOST_CDC_ACM=n
CONFIG_CHERRYUSB_HOST_CH34X=n
CONFIG_CHERRYUSB_HOST_HID=n
# Keep USB buffers and stacks within CP SRAM; large allocations use PSRAM.
CONFIG_HEAP_SIZE=0xC000
