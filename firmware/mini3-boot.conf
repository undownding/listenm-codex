# Mini3 recovery boot: AP voice at 256 KiB, CP application at 6 MiB.
CONFIG_MEM_CONFIG=n
CONFIG_BOOT_AP_ENTRY=0x30040000
CONFIG_BOOT_CP_ENTRY=0x30600000
CONFIG_APPLICATION_ADDRESS=0x30600000
CONFIG_BOOT_FLASH_SIZE=0x40000
CONFIG_BOOT_SECOND_STAGE=y
CONFIG_BOOT_ADB=y
CONFIG_BOOT_ADB_BACKEND_TINYUSB=y
CONFIG_BOOT_ADB_SHELL=y
CONFIG_BOOT_ADB_SYNC=y
CONFIG_ADB_MAX_PAYLOAD_SIZE=4096
CONFIG_BOOT_RECOVERY=y
CONFIG_BOOT_DISPLAY=n
CONFIG_BOOT_POWER_GUARD=y
CONFIG_BOOT_POWER_GUARD_LONG_PRESS_STARTUP=n
CONFIG_BOOT_POWER_GUARD_USB_PIN=8
CONFIG_BOOT_POWER_GUARD_KEY_PIN=4
CONFIG_BOOT_POWER_GUARD_LATCH_PIN=3
CONFIG_BOOT_POWER_GUARD_LED=n
CONFIG_CHERRYUSB_HOST=n
CONFIG_CHERRYUSB_HOST_MUSB_LISA=n
CONFIG_CHERRYUSB_HOST_CDC_ACM=n
CONFIG_CHERRYUSB_HOST_CH34X=n
CONFIG_CHERRYUSB_HOST_HID=n
CONFIG_BOOT_APP_CORE_AP=y
CONFIG_BOOT_EARLY_LOG=y
CONFIG_FREERTOS_STATIC_ALLOCATION_ENABLE=y
CONFIG_CHERRYUSB=n
CONFIG_CHERRYUSB_APP_CLASS=n
CONFIG_CHERRYUSB_DEVICE=n
